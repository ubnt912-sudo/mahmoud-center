<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#1B263B">
<title>محمود سنتر | النظام المتكامل</title>
<style>
:root{--navy:#1B263B;--orange:#F97316;--bg:#F3F4F6;--white:#fff;--muted:#6B7280;--green:#16A34A;--red:#DC2626}
*{box-sizing:border-box}body{margin:0;font-family:Tahoma,Arial,sans-serif;background:var(--bg);color:#111827}button,input,textarea,select{font:inherit}button{cursor:pointer;border:0}.app{min-height:100vh}.top{background:var(--navy);color:white;padding:22px 16px;border-radius:0 0 28px 28px}.wrap{max-width:1100px;margin:auto}.brand{font-size:28px;font-weight:900}.muted{color:var(--muted);font-size:13px}.search{display:flex;gap:8px;margin-top:16px}.search input{flex:1}.input,.select,.textarea{width:100%;padding:12px;border:1px solid #e5e7eb;border-radius:14px;background:#fff;outline:none}.input:focus,.select:focus,.textarea:focus{border-color:var(--orange)}.btn{padding:11px 16px;border-radius:14px;font-weight:800}.primary{background:var(--orange);color:#fff}.dark{background:var(--navy);color:#fff}.light{background:#fff;color:var(--navy);border:1px solid #e5e7eb}.danger{background:#fee2e2;color:#991b1b}.grid{display:grid;gap:14px}.cats{grid-template-columns:repeat(2,1fr);margin-top:18px}.card{background:#fff;border-radius:22px;padding:18px;box-shadow:0 8px 30px #0000000a}.cat{text-align:center;min-height:130px;display:flex;flex-direction:column;align-items:center;justify-content:center;font-weight:800}.icon{font-size:38px;margin-bottom:8px}.products{grid-template-columns:repeat(auto-fit,minmax(180px,1fr))}.product img{width:100%;height:140px;object-fit:cover;border-radius:16px;background:#eee}.price{font-size:20px;font-weight:900;color:var(--orange)}.old{text-decoration:line-through;color:#999;font-size:12px}.layout{display:flex;min-height:100vh}.side{width:245px;background:var(--navy);color:#fff;padding:20px;position:sticky;top:0;height:100vh}.side button{display:block;width:100%;text-align:right;background:transparent;color:#ddd;padding:13px;border-radius:13px;margin:6px 0}.side button.active,.side button:hover{background:#ffffff12;color:#fff}.main{flex:1;padding:22px}.stats{grid-template-columns:repeat(4,1fr)}.stat h2{margin:5px 0;font-size:26px}.table{width:100%;border-collapse:collapse}.table th,.table td{padding:12px;border-bottom:1px solid #eee;text-align:right;font-size:13px}.badge{display:inline-block;padding:6px 10px;border-radius:999px;font-size:12px;font-weight:800;background:#fff7ed;color:#c2410c}.ok{background:#dcfce7;color:#166534}.bottom{position:fixed;bottom:0;left:0;right:0;background:#fff;padding:10px;display:flex;justify-content:center;gap:20px;box-shadow:0 -8px 30px #0000000c;z-index:5}.bottom button{background:transparent;color:var(--navy)}.hidden{display:none!important}.modal{position:fixed;inset:0;background:#0008;display:flex;align-items:center;justify-content:center;padding:18px;z-index:20}.modalbox{background:#fff;border-radius:24px;padding:22px;width:min(520px,100%);max-height:90vh;overflow:auto}.timeline{border-right:3px solid #e5e7eb;padding-right:16px}.step{position:relative;margin:0 0 22px}.step:before{content:"";position:absolute;right:-24px;top:2px;width:12px;height:12px;border-radius:50%;background:var(--orange);border:3px solid #fff;box-shadow:0 0 0 1px #ddd}.notice{padding:12px;border-radius:14px;background:#fff7ed;margin:10px 0}.emoji{font-size:30px;padding:8px;background:#f9fafb;border-radius:14px}.row{display:flex;gap:8px;align-items:center;justify-content:space-between}.actions{display:flex;gap:7px;flex-wrap:wrap}.section{padding:20px 0}.empty{text-align:center;padding:35px;color:#9ca3af}@media(max-width:800px){.side{display:none}.main{padding:14px 14px 80px}.stats{grid-template-columns:repeat(2,1fr)}.cats{grid-template-columns:repeat(2,1fr)}.top{padding:18px 14px}.table{font-size:12px}.desktopOnly{display:none}}@media(min-width:801px){.bottom{display:none}}
</style>
</head>
<body>
<div id="app"></div>
<script>
const KEY="mahmoud_center_v1";
const initial={visitors:0,customers:[],products:[
{id:"p1",sku:"PHONE-001",name:"iPhone 15 Pro",category:"هواتف جديدة",price:1250000,oldPrice:1300000,stock:3,img:"https://images.unsplash.com/photo-1592899677977-9c10ca588bbd8?w=600"},
{id:"p2",sku:"PHONE-002",name:"Samsung S23 Ultra",category:"هواتف جديدة",price:980000,oldPrice:1050000,stock:5,img:"https://images.unsplash.com/photo-1610945265064-0e34e5519bbf?w=600"},
{id:"p3",sku:"USED-001",name:"iPhone 13 Pro",category:"هواتف مستخدمة",price:650000,stock:2,img:"https://images.unsplash.com/photo-1556656793-08538906a9f8?w=600"},
{id:"p4",sku:"EAR-001",name:"AirPods M10",category:"سماعات",price:18000,stock:10,img:"https://images.unsplash.com/photo-1606220945770-b5b6c2c55bf1?w=600"},
{id:"p5",sku:"CH-001",name:"شاحن سريع",category:"شواحن",price:12000,stock:20,img:"https://images.unsplash.com/photo-1583863788434-e58a36330cf0?w=600"}],
repairs:[],orders:[],messages:[]};
let db=JSON.parse(localStorage.getItem(KEY)||"null")||initial;
function save(){localStorage.setItem(KEY,JSON.stringify(db))}
function esc(s){return String(s??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[m]))}
function id(){return Date.now().toString(36)+Math.random().toString(36).slice(2,7)}
function wa(phone,text){let p=String(phone).replace(/\D/g,""); if(p.startsWith("07"))p="964"+p.slice(1); location.href="https://wa.me/"+p+"?text="+encodeURIComponent(text)}
function render(){let token=new URLSearchParams(location.search).get("customer"); if(token){customerPage(token);return} adminPage()}
function adminPage(){
app.innerHTML=`<div class="layout"><aside class="side"><div class="brand">محمود <span style="color:#F97316">سنتر</span></div><p class="muted" style="color:#cbd5e1">لوحة الإدارة</p>
<button id="dash" class="active" onclick="adminTab('dash')">📊 الرئيسية</button><button onclick="adminTab('customers')">👥 CRM الزبائن</button><button onclick="adminTab('repairs')">🔧 الصيانة</button><button onclick="adminTab('products')">📦 المنتجات والمخزون</button><button onclick="adminTab('orders')">🛒 الطلبات والمبيعات</button><button onclick="adminTab('messages')">💬 الرسائل</button><button onclick="adminTab('internet')">🌐 الإنترنت</button><button onclick="customerPage('')">👤 معاينة الزبون</button></aside><main class="main" id="adminMain"></main></div>`;
adminTab("dash")
}
function adminTab(tab){
document.querySelectorAll(".side button").forEach(x=>x.classList.remove("active"));
const main=document.getElementById("adminMain");
let html="";
if(tab==="dash")html=dashboard();
if(tab==="customers")html=customers();
if(tab==="repairs")html=repairs();
if(tab==="products")html=products();
if(tab==="orders")html=orders();
if(tab==="messages")html=messages();
if(tab==="internet")html=internet();
main.innerHTML=html;
}
function dashboard(){return `<div class="row"><div><h1>لوحة التحكم</h1><p class="muted">إدارة محمود سنتر من مكان واحد</p></div><button class="btn primary" onclick="newRepair()">+ استلام جهاز</button></div>
<div class="grid stats section"><div class="card stat"><div class="muted">الزائرون</div><h2>${db.visitors}</h2></div><div class="card stat"><div class="muted">أجهزة بالصيانة</div><h2>${db.repairs.filter(x=>!["DELIVERED","CANCELLED"].includes(x.status)).length}</h2></div><div class="card stat"><div class="muted">الزبائن</div><h2>${db.customers.length}</h2></div><div class="card stat"><div class="muted">الرسائل</div><h2>${db.messages.filter(x=>!x.read).length}</h2></div></div>
<div class="grid" style="grid-template-columns:repeat(auto-fit,minmax(280px,1fr))"><div class="card"><h3>آخر الصيانة</h3>${db.repairs.slice(-5).reverse().map(r=>`<div class="notice"><b>${esc(r.device)}</b><br><span class="muted">${esc(r.customerName)} — ${esc(statusName(r.status))}</span></div>`).join("")||'<div class="empty">لا توجد صيانة</div>'}</div><div class="card"><h3>آخر الرسائل</h3>${db.messages.slice(-5).reverse().map(m=>`<div class="notice"><b>${esc(m.type)}</b> — ${esc(m.content)}</div>`).join("")||'<div class="empty">لا توجد رسائل</div>'}</div></div>`}
function customers(){return `<div class="row"><h1>CRM الزبائن</h1><button class="btn primary" onclick="newCustomer()">+ زبون</button></div><div class="card section"><table class="table"><tr><th>الاسم</th><th>الهاتف</th><th>الحالة</th><th>الرابط</th><th>إجراء</th></tr>${db.customers.map(c=>`<tr><td>${esc(c.name)}</td><td>${esc(c.phone)}</td><td><span class="badge ${c.status==='ACTIVE'?'ok':''}">${c.status==='ACTIVE'?'فعال':'محظور'}</span></td><td><button class="btn light" onclick="copyLink('${c.token}')">نسخ</button></td><td><div class="actions"><button class="btn light" onclick="wa('${c.phone}','أهلاً ${c.name}، هذا رابط ملفك في محمود سنتر: '+link(c.token))">واتساب</button><button class="btn ${c.status==='ACTIVE'?'danger':'primary'}" onclick="toggleBlock('${c.id}')">${c.status==='ACTIVE'?'حظر':'رفع الحظر'}</button></div></td></tr>`).join("")||'<tr><td colspan="5" class="empty">لا يوجد زبائن</td></tr>'}</table></div>`}
function repairs(){return `<div class="row"><h1>إدارة الصيانة</h1><button class="btn primary" onclick="newRepair()">+ استلام جهاز</button></div><div class="grid section" style="grid-template-columns:repeat(auto-fit,minmax(280px,1fr))">${db.repairs.slice().reverse().map(r=>`<div class="card"><div class="row"><b>${esc(r.device)}</b><span class="badge">${esc(statusName(r.status))}</span></div><p class="muted">${esc(r.customerName)} — ${esc(r.phone)}</p><p>${esc(r.issue)}</p><p class="muted">كود: ${esc(r.code)}</p><div class="actions"><select class="select" onchange="changeStatus('${r.id}',this.value)">${statuses.map(s=>`<option value="${s}" ${s===r.status?"selected":""}>${statusName(s)}</option>`).join("")}</select><button class="btn light" onclick="wa('${r.phone}','تحديث صيانة ${r.code}: '+statusName(r.status))">إرسال واتساب</button></div></div>`).join("")||'<div class="empty">لا توجد أجهزة</div>'}</div>`}
const statuses=["RECEIVED","INSPECTING","WAITING_APPROVAL","REPAIRING","READY","DELIVERED","CANCELLED"];
function statusName(s){return {RECEIVED:"تم الاستلام",INSPECTING:"قيد الفحص",WAITING_APPROVAL:"بانتظار موافقة الزبون",REPAIRING:"قيد الصيانة",READY:"جاهز للاستلام",DELIVERED:"تم التسليم",CANCELLED:"ملغى"}[s]||s}
function products(){return `<div class="row"><h1>المنتجات والمخزون</h1><button class="btn primary" onclick="newProduct()">+ منتج</button></div><div class="grid products section">${db.products.map(p=>`<div class="card product"><img src="${esc(p.img)}" onerror="this.style.display='none'"><h3>${esc(p.name)}</h3><div class="muted">${esc(p.category)} · مخزون ${p.stock}</div><div class="price">${p.price.toLocaleString()} د.ع</div>${p.oldPrice?`<div class="old">${p.oldPrice.toLocaleString()} د.ع</div>`:""}<div class="actions" style="margin-top:10px"><button class="btn light" onclick="editProduct('${p.id}')">تعديل</button><button class="btn danger" onclick="deleteProduct('${p.id}')">حذف</button></div></div>`).join("")}</div>`}
function orders(){return `<h1>الطلبات والمبيعات</h1><div class="card section"><table class="table"><tr><th>الكود</th><th>الزبون</th><th>المجموع</th><th>الحالة</th></tr>${db.orders.map(o=>`<tr><td>${o.code}</td><td>${esc(o.customerName)}</td><td>${o.total.toLocaleString()} د.ع</td><td><span class="badge">${esc(o.status)}</span></td></tr>`).join("")||'<tr><td colspan="4" class="empty">لا توجد طلبات</td></tr>'}</table></div>`}
function messages(){return `<div class="row"><h1>رسائل الزبائن</h1></div><div class="grid section">${db.messages.slice().reverse().map(m=>`<div class="card"><div class="row"><b>${esc(m.customerName)}</b><span class="muted">${esc(m.type)}</span></div><p>${esc(m.content)}</p>${m.reply?`<div class="notice">رد الإدارة: ${esc(m.reply)}</div>`:""}<div class="actions"><button class="btn primary" onclick="replyMsg('${m.id}')">رد</button><button class="btn light" onclick="wa('${m.phone}','رد محمود سنتر: ')">واتساب</button></div></div>`).join("")||'<div class="empty">لا توجد رسائل</div>'}</div>`}
function internet(){return `<h1>الإنترنت</h1><div class="grid" style="grid-template-columns:repeat(auto-fit,minmax(230px,1fr));margin-top:18px"><div class="card"><h3>📡 FTTH</h3><p class="muted">إدارة المشتركين والباقات وحالات الانتهاء.</p></div><div class="card"><h3>📶 Wireless</h3><p class="muted">إدارة الاشتراكات والتنبيهات.</p></div></div>`}
function customerPage(token){
db.visitors++;save();
let c=db.customers.find(x=>x.token===token);
app.innerHTML=`<div class="wrap" style="max-width:600px;padding-bottom:90px"><div class="top"><div class="brand">محمود سنتر</div><div class="muted" style="color:#e5e7eb">صيانة أذكى. تكنولوجيا أسرع.</div><div class="search"><input class="input" id="search" placeholder="ابحث عن هاتف، سماعة، شاحن..." oninput="filterProducts(this.value)"><button class="btn primary">بحث</button></div></div>
<div class="section"><h2>تصفح الأقسام</h2><div class="grid cats">
${["هواتف جديدة","هواتف مستخدمة","سماعات","شواحن","إكسسوارات","العروض","الصيانة","الإنترنت الضوئي","الإنترنت اللاسلكي"].map((x,i)=>`<div class="card cat" onclick="customerSection('${x}')"><span class="icon">${["📱","📱","🎧","🔌","🧩","🔥","🔧","🌐","📡"][i]}</span>${x}</div>`).join("")}</div></div>
<div id="customerContent"></div>
<div class="bottom"><button onclick="customerSection('الكل')">🏠<br><small>الرئيسية</small></button><button onclick="showCart()">🛒<br><small>السلة</small></button><button onclick="showContact()">💬<br><small>تواصل معنا</small></button></div></div>`;
if(c) showCustomerProfile(c); else customerSection("الكل");
}
function customerSection(cat){
let ps=cat==="الكل"?db.products:db.products.filter(p=>p.category===cat||(cat==="العروض"&&p.oldPrice));
document.getElementById("customerContent").innerHTML=`<div class="section"><div class="row"><h2>${cat}</h2>${cat==="الصيانة"?'':""}</div><div class="grid products">${ps.map(p=>`<div class="card product"><img src="${esc(p.img)}"><h3>${esc(p.name)}</h3><div class="muted">${esc(p.category)} · متوفر ${p.stock}</div><div class="price">${p.price.toLocaleString()} د.ع</div>${p.oldPrice?`<div class="old">${p.oldPrice.toLocaleString()} د.ع</div>`:""}<button class="btn primary" style="width:100%;margin-top:10px" onclick="askPrice('${p.id}')">اسأل عن المنتج</button></div>`).join("")||'<div class="empty">لا توجد منتجات بهذا القسم حالياً</div>'}</div></div>
${cat.includes("إنترنت")?`<div class="card"><h3>طلب اشتراك</h3><p class="muted">اختار الباقة المناسبة وسنرد عليك.</p><button class="btn primary" onclick="showContact('ISP')">طلب اشتراك</button></div>`:""}
${cat==="الصيانة"?`<div class="card"><h3>🔧 تتبع الصيانة</h3><p class="muted">افتح رابطك الخاص المرسل من محمود سنتر لمشاهدة حالة جهازك.</p></div>`:""}`;
}
function showCustomerProfile(c){
document.getElementById("customerContent").innerHTML=`<div class="section"><div class="card"><h2>أهلاً ${esc(c.name)} 👋</h2><p class="muted">هذا ملفك الخاص في محمود سنتر</p>${db.repairs.filter(r=>r.customerId===c.id).map(r=>`<div class="notice"><div class="row"><b>${esc(r.device)}</b><span class="badge">${statusName(r.status)}</span></div><p>${esc(r.issue)}</p><div class="timeline">${r.timeline.map(t=>`<div class="step"><b>${statusName(t.status)}</b><div class="muted">${esc(t.note||"")} · ${esc(t.date)}</div></div>`).join("")}</div></div>`).join("")||"<p>لا توجد أجهزة صيانة مسجلة.</p>}<button class="btn primary" onclick="showContact('REPAIR')">رسالة للإدارة</button></div></div>`;
}
function showContact(type="GENERAL"){document.getElementById("customerContent").innerHTML=`<div class="section"><div class="card"><h2>تواصل مع محمود سنتر</h2><select id="msgType" class="select"><option>GENERAL</option><option>PRICE</option><option>STOCK</option><option>REPAIR</option><option>ORDER</option><option>ISP</option></select><textarea id="msgText" class="textarea" rows="5" style="margin-top:10px" placeholder="اكتب رسالتك..."></textarea><button class="btn primary" style="margin-top:10px;width:100%" onclick="sendCustomerMsg()">إرسال للإدارة</button></div></div>`;document.getElementById("msgType").value=type}
function sendCustomerMsg(){let token=new URLSearchParams(location.search).get("customer"),c=db.customers.find(x=>x.token===token),txt=document.getElementById("msgText").value.trim();if(!txt)return alert("اكتب الرسالة");db.messages.push({id:id(),customerId:c?.id||null,customerName:c?.name||"زائر",phone:c?.phone||"",type:document.getElementById("msgType").value,content:txt,reply:"",read:false,date:new Date().toLocaleString("ar-IQ")});save();alert("تم إرسال الرسالة للإدارة");showContact()}
function askPrice(pid){let p=db.products.find(x=>x.id===pid);showContact("PRICE");setTimeout(()=>document.getElementById("msgText").value=`أريد معرفة تفاصيل وسعر ${p.name}`)}
function showCart(){alert("السلة جاهزة للتطوير إلى طلب شراء مباشر.")}
function filterProducts(q){customerSection("الكل");let cards=[...document.querySelectorAll(".product")];cards.forEach((el,i)=>el.style.display=el.innerText.toLowerCase().includes(q.toLowerCase())?"":"none")}
function link(token){return location.origin+location.pathname+"?customer="+token}
function copyLink(token){navigator.clipboard?.writeText(link(token));alert("تم نسخ رابط الزبون")}
function newCustomer(){let n=prompt("اسم الزبون");if(!n)return;let p=prompt("رقم الهاتف");if(!p)return;db.customers.push({id:id(),name:n,phone:p,token:id(),status:"ACTIVE",createdAt:new Date().toISOString()});save();adminTab("customers")}
function toggleBlock(cid){let c=db.customers.find(x=>x.id===cid);c.status=c.status==="ACTIVE"?"BLOCKED":"ACTIVE";c.blockReason=c.status==="BLOCKED"?"حظر من الإدارة":"";save();adminTab("customers")}
function newRepair(){let n=prompt("اسم الزبون");if(!n)return;let p=prompt("رقم الهاتف");if(!p)return;let d=prompt("نوع/موديل الجهاز");if(!d)return;let issue=prompt("وصف العطل");let c=db.customers.find(x=>x.phone===p);if(!c){c={id:id(),name:n,phone:p,token:id(),status:"ACTIVE"};db.customers.push(c)}let r={id:id(),code:"REP-"+Date.now().toString().slice(-6),customerId:c.id,customerName:c.name,phone:c.phone,device:d,issue:issue||"",status:"RECEIVED",timeline:[{status:"RECEIVED",note:"تم استلام الجهاز",date:new Date().toLocaleString("ar-IQ")}]};db.repairs.push(r);save();wa(c.phone,`أهلاً ${c.name}، تم استلام جهازك في محمود سنتر.\\nكود الصيانة: ${r.code}\\nرابط المتابعة: ${link(c.token)}`);adminTab("repairs")}
function changeStatus(rid,s){let r=db.repairs.find(x=>x.id===rid);r.status=s;r.timeline.push({status:s,note:"تم تحديث الحالة من الإدارة",date:new Date().toLocaleString("ar-IQ")});save();adminTab("repairs")}
function newProduct(){let n=prompt("اسم المنتج");if(!n)return;let price=Number(prompt("سعر البيع")||0),cat=prompt("القسم","إكسسوارات");db.products.push({id:id(),sku:"SKU-"+Date.now(),name:n,category:cat,price,stock:Number(prompt("الكمية")||0),img:"https://images.unsplash.com/photo-1556656793-08538906a9f8?w=600"});save();adminTab("products")}
function editProduct(pid){let p=db.products.find(x=>x.id===pid);p.price=Number(prompt("السعر",p.price)||p.price);p.stock=Number(prompt("المخزون",p.stock)||p.stock);save();adminTab("products")}
function deleteProduct(pid){if(confirm("حذف المنتج؟")){db.products=db.products.filter(x=>x.id!==pid);save();adminTab("products")}}
function replyMsg(mid){let m=db.messages.find(x=>x.id===mid),r=prompt("اكتب الرد");if(r===null)return;m.reply=r;m.read=true;save();adminTab("messages")}
render();
</script>
</body>
</html>
